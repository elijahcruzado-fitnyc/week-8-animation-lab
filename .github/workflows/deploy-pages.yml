name: Deploy animation-project to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: animation-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: animation-project/package-lock.json
      - run: npm ci
      # Static export of the Next.js app into animation-project/out
      - run: npm run build
      # Storybook goes inside the same export at /storybook/
      - run: npx storybook build -o out/storybook --quiet
      # Tell Pages not to run Jekyll, which would hide the _next folder
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: animation-project/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
